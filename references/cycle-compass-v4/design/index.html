 class="tiny">独立模型 · P1</span></div>${item('银行','复苏 → 扩张',5)}${item('半导体','扩张 → 衰减',5)}<div class="alert">轮动与趋势节气及宏观美林时钟是不同模型；此图为示意。</div>`, '')}
function render(){let html='';if(isReport){html=reportHtml(isReport);document.getElementById('screenNote').innerText='独立分享报告模板 · 固定合成示例数据';}else{let pages={1:page1,2:()=>page2(false),3:page3,4:()=>detail(true),5:()=>detail(false),6:page6,7:page7,8:page8,9:page9,10:page10,11:page11,12:page12,13:page13,14:page14,15:page15,16:page16,17:page17,18:()=>page2(true),19:page19,20:page20,21:page21,22:page22};html=pages[current]();document.getElementById('screenNote').innerText=`${String(current).padStart(2,'0')} / ${names[current-1]} · 375×812 逻辑像素 · 合成设计数据；导航及部分控件可演示，真实业务见实施提示词。`; }document.getElementById('screenRoot').innerHTML=html;document.getElementById('navList').innerHTML='<h4>金融资产 · 页面</h4>'+names.map((n,i)=>`<button class="${!isReport&&current===i+1?'sel':''}" onclick="show(${i+1})">${String(i+1).padStart(2,'0')}　${n}</button>`).join('')+'<h4>独立分享报告</h4>'+reportNames.map((n,i)=>`<button class="${isReport===i+1?'sel':''}" onclick="showReport(${i+1})">R${i+1}　${n}</button>`).join('')}
function show(n){isReport=0;current=n;render()}function showReport(n){isReport=n;render()}function toggleTheme(){theme=theme==='dark'?'light':'dark';render()}render();
