services:
  # 主生产 API 服务（Go 高性能实现，内置 SQLite 持久化与主动行情刷新）
  api-go:
    build:
      context: ../../services/api-go
      dockerfile: Dockerfile
    container_name: cycle-compass-api-go
    restart: unless-stopped
    ports:
      - "${CYCLE_GO_PORT:-8002}:8002"
    environment:
      - PORT=8002
      - DATA_DIR=/app/references/strategy_original/index_rotation/data
      - DB_PATH=/app/data/cyclecompass.db
    volumes:
      - api_go_data:/app/data
      - ../../references/strategy_original/index_rotation/data:/app/references/strategy_original/index_rotation/data:ro
    networks:
      - cycle-net

  # 量化研究与回测参考 API（Python FastAPI）
  api:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile.api
    container_name: cycle-compass-api
    restart: unless-stopped
    ports:
      - "${CYCLE_PY_PORT:-8000}:8000"
    environment:
      - CYCLE_APP_NAME=周期罗盘 CycleCompass API
      - CYCLE_DEBUG=${CYCLE_DEBUG:-false}
      - CYCLE_CORS_ORIGINS=${CYCLE_CORS_ORIGINS:-["*"]}
      - CYCLE_DATABASE_URL=sqlite+aiosqlite:////app/data/cycle_compass.db
    volumes:
      - api_py_data:/app/data
    networks:
      - cycle-net

networks:
  cycle-net:
    driver: bridge

volumes:
  api_go_data:
  api_py_data:
