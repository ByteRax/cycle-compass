[project]
name = "cycle-compass"
version = "0.1.0"
description = "周期罗盘 CycleCompass: 全球宏观周期、产业监测、量化策略与模拟投资平台"
authors = [{ name = "ByteRan" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "sqlalchemy>=2.0.30",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "services*"]
exclude = ["apps*", "infra*", "references*", "docs*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["packages", "services", "tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
